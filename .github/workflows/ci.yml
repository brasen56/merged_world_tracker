# GitHub Actions CI for the Merged World Tracker extension.
#
# Runs on every push to main and testing and on every pull request. Two gates:
#   1. `npm run lint` — the ESLint correctness pass (eslint.config.mjs).
#   2. `npm test`     — the full Vitest suite.
#
# Both must pass for a PR to be mergeable. The matrix runs Node 22 and 24 (the
# current Maintenance LTS and Active LTS lines) so a syntax/runtime regression on
# either is caught early.
name: CI

permissions:
  contents: read
  
on:
  push:
    branches: [main, testing]
  pull_request:
    branches: [main, testing]

# Cancel in-progress runs for the same ref when a new commit is pushed.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@12b7ff3796cabd9e0da05c556468eec2f565d246 # v7.0.1
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint — correctness rules)
        run: npm run lint

      - name: Test (Vitest)
        run: npm test
